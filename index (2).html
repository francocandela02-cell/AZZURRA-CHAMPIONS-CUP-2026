<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#08090E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Azzurra CC"/>
<title>Azzurra Champions Cup</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#08090E;color:#E8EDF8;font-family:'Oswald',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#1E2540;border-radius:4px;}
.page{display:none;padding-bottom:80px;}.page.active{display:block;}
.header{position:sticky;top:0;z-index:50;background:rgba(8,9,14,0.94);backdrop-filter:blur(16px);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,229,255,0.2);}
.hlogo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.hlogo img{width:36px;height:36px;object-fit:contain;border-radius:6px;}
.htitle{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;}
.htitle .a{background:linear-gradient(90deg,#fff,#00E5FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.htitle .b{background:linear-gradient(90deg,#FFD700,#FF6B00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.live{background:rgba(0,255,135,0.15);border:1px solid rgba(0,255,135,0.4);color:#00FF87;padding:3px 10px;border-radius:20px;font-size:10px;letter-spacing:2px;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(8,9,14,0.97);backdrop-filter:blur(16px);border-top:1px solid rgba(0,229,255,0.2);display:flex;padding:8px 2px 14px;z-index:50;}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 0;}
.nicon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid transparent;}
.nlbl{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:1px;color:#5A6480;text-transform:uppercase;}
.nbtn.active .nlbl{color:var(--c);}
.nbtn.active .nicon{border-color:rgba(var(--cr),0.6);background:rgba(var(--cr),0.18);}
.hero{text-align:center;padding:36px 20px 28px;background:radial-gradient(ellipse at 50% -10%,rgba(0,229,255,0.1) 0%,rgba(155,93,229,0.06) 40%,transparent 70%);border-bottom:1px solid #1E2540;}
.hlogo-big{width:90px;height:90px;object-fit:contain;margin:0 auto 12px;display:block;filter:drop-shadow(0 0 20px rgba(0,229,255,0.4));}
.hedition{font-size:11px;letter-spacing:5px;color:#00E5FF;font-family:'Oswald',sans-serif;margin-bottom:4px;text-transform:uppercase;}
.htitle-big{font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;letter-spacing:5px;background:linear-gradient(135deg,#fff 0%,#00E5FF 50%,#FFD700 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hsub{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:6px;background:linear-gradient(90deg,#FFD700,#FF6B00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px;}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.badge{background:rgba(0,229,255,0.15);border:1px solid rgba(0,229,255,0.4);color:#00E5FF;padding:3px 10px;border-radius:20px;font-size:10px;letter-spacing:2px;text-transform:uppercase;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:16px 16px 0;}
.scard{border-radius:12px;padding:14px 8px;text-align:center;}
.snum{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;}
.slbl{font-size:9px;color:#5A6480;margin-top:4px;font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase;line-height:1.3;}
.stitle{display:flex;align-items:center;gap:10px;margin:20px 16px 12px;}
.stitle::before,.stitle::after{content:'';flex:1;height:1px;}
.stitle span{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:4px;white-space:nowrap;}
.evlist{padding:0 16px;}
.evrow{display:flex;gap:12px;align-items:stretch;margin-bottom:10px;}
.evrow.past{opacity:0.5;}
.evdate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:50px;border-radius:10px;padding:8px 4px;border:1px solid #1E2540;background:#161B2C;}
.evday{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;}
.evmon{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#5A6480;}
.evcont{flex:1;background:#10131C;border:1px solid #1E2540;border-radius:10px;padding:10px 14px;}
.evname{font-family:'Oswald',sans-serif;font-size:14px;color:#E8EDF8;font-weight:600;}
.evdesc{font-size:12px;color:#5A6480;margin-top:3px;font-family:'Oswald',sans-serif;}
.oggi{display:inline-block;padding:2px 8px;border-radius:12px;font-size:9px;letter-spacing:2px;margin-left:8px;}
.card{background:#10131C;border:1px solid #1E2540;border-radius:12px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden;}
.ctop{position:absolute;top:0;left:0;right:0;height:3px;}
.srow{display:flex;align-items:center;gap:8px;}
.tname{flex:1;font-family:'Oswald',sans-serif;font-size:14px;color:#E8EDF8;line-height:1.2;}
.tname.r{text-align:right;}
.sbox{background:#161B2C;color:#5A6480;font-family:'Bebas Neue',sans-serif;font-size:26px;min-width:38px;text-align:center;border-radius:8px;padding:4px 6px;}
.vs{color:#5A6480;font-size:11px;font-family:'Oswald',sans-serif;}
.inprog{text-align:center;margin-top:8px;font-size:10px;color:#5A6480;letter-spacing:2px;font-family:'Oswald',sans-serif;}
.scbar{background:#08090E;border:1px solid #1E2540;border-radius:0 0 10px 10px;padding:8px 14px;margin-top:-12px;margin-bottom:10px;font-size:12px;color:#5A6480;}
.gtabs{display:flex;gap:8px;margin:0 16px 16px;}
.gtab{flex:1;padding:10px 0;border-radius:10px;border:none;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;background:#161B2C;color:#5A6480;outline:1px solid #1E2540;}
.standings{background:#10131C;border-radius:12px;overflow:hidden;margin:0 16px;}
.sth{display:grid;grid-template-columns:22px 1fr 26px 26px 26px 26px 26px 26px 30px;gap:4px;padding:10px 12px;background:#161B2C;}
.sth span,.str span{font-family:'Oswald',sans-serif;font-size:11px;color:#5A6480;text-align:center;letter-spacing:1px;}
.str{display:grid;grid-template-columns:22px 1fr 26px 26px 26px 26px 26px 26px 30px;gap:4px;padding:12px;align-items:center;border-top:1px solid #1E2540;}
.str .pos{font-family:'Bebas Neue',sans-serif;font-size:16px;text-align:center;}
.str .tm{font-family:'Oswald',sans-serif;font-size:12px;color:#E8EDF8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.str .pts{font-family:'Bebas Neue',sans-serif;font-size:20px;text-align:center;}
.sccard{display:flex;align-items:center;gap:14px;background:#10131C;border:1px solid #1E2540;border-radius:12px;padding:14px 16px;margin:0 16px 8px;position:relative;overflow:hidden;}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.rbtn{background:#10131C;border:1px solid #1E2540;border-radius:12px;padding:16px 12px;cursor:pointer;text-align:left;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:100;overflow-y:auto;display:none;}
.overlay.open{display:block;}
.awrap{max-width:480px;margin:0 auto;padding:16px 16px 100px;}
.atabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.atab{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;background:#161B2C;color:#5A6480;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;}
.atab.active{background:#FFD700;color:#000;}
.asec{display:none;}.asec.active{display:block;}
.gblock{background:#10131C;border:1px solid #1E2540;border-radius:10px;padding:14px;margin-bottom:12px;}
.mblock{background:#10131C;border:1px solid #1E2540;border-radius:10px;padding:12px;margin-bottom:10px;}
input,select{background:#161B2C;border:1px solid #1E2540;color:#E8EDF8;padding:8px 10px;border-radius:8px;font-family:'Oswald',sans-serif;font-size:14px;width:100%;outline:none;}
input:focus{border-color:#00E5FF;}
input[type=date]{color-scheme:dark;}
.irow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.irow input{flex:1;}
.bprim{background:linear-gradient(135deg,#FFD700,#FF6B00);border:none;color:#000;padding:10px 16px;border-radius:8px;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;width:100%;}
.bsm{background:rgba(0,229,255,0.15);border:1px solid rgba(0,229,255,0.4);color:#00E5FF;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:12px;}
.bdel{background:rgba(255,45,120,0.15);border:1px solid rgba(255,45,120,0.4);color:#FF2D78;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;}
.asave{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px;background:#08090E;border-top:1px solid #1E2540;}
.pwm{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:99;display:none;align-items:center;justify-content:center;padding:20px;}
.pwm.open{display:flex;}
.pwbox{background:#10131C;border:1px solid rgba(255,215,0,0.4);border-radius:16px;padding:24px;width:100%;max-width:320px;}
.eadm{background:#10131C;border:1px solid #1E2540;border-radius:10px;padding:14px;margin-bottom:12px;}
.scinp{display:flex;gap:6px;margin-bottom:6px;}
.scinp input{flex:1;padding:5px 8px;}
</style>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyBZ1f5mrIqWlwIUXgG85NDSof7rZoxSst8",authDomain:"azzurra-champions-cup.firebaseapp.com",projectId:"azzurra-champions-cup",storageBucket:"azzurra-champions-cup.firebasestorage.app",messagingSenderId:"467270395374",appId:"1:467270395374:web:4abe7a67dd989ae1c85aff"});
const db=getFirestore(fb);
const PW="Azzurra2025!Cup";
const GC={A:"#00E5FF",B:"#00FF87",C:"#FF2D78",D:"#9B5DE5"};
const DG={A:["Squadra A1","Squadra A2","Squadra A3","Squadra A4"],B:["Squadra B1","Squadra B2","Squadra B3","Squadra B4"],C:["Squadra C1","Squadra C2","Squadra C3","Squadra C4"],D:["Squadra D1","Squadra D2","Squadra D3","Squadra D4"]};
function mkM(g){const a={};Object.entries(g).forEach(([k,t])=>{const m=[];for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++)m.push({id:k+m.length,home:t[i],away:t[j],hs:null,as:null,scorers:{},played:false});a[k]=m;});return a;}
let D={groups:JSON.parse(JSON.stringify(DG)),rosters:Object.fromEntries(Object.values(DG).flat().map(t=>[t,[]])),matches:mkM(DG),knockout:{quarters:Array(4).fill(null).map((_,i)=>({id:"Q"+i,home:"TBD",away:"TBD",hs:null,as:null,played:false})),semis:Array(2).fill(null).map((_,i)=>({id:"S"+i,home:"TBD",away:"TBD",hs:null,as:null,played:false})),final:{id:"F0",home:"TBD",away:"TBD",hs:null,as:null,played:false}},events:[]};
onSnapshot(doc(db,"tournament","data"),s=>{if(s.exists()){const d=s.data();D={...D,...d,events:d.events||[]};}renderAll();});
window._save=async()=>{await setDoc(doc(db,"tournament","data"),D);};

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(",");}
function stitle(t,c){return`<div class="stitle" style="--c:${c}"><style>.stitle[style]::before{background:linear-gradient(90deg,${c}80,transparent)}.stitle[style]::after{background:linear-gradient(270deg,${c}80,transparent)}</style><span style="color:${c}">${t}</span></div>`;}
function scard(h,a,hs,as_,pl,c){const t=pl?`background:linear-gradient(90deg,${c},#00E5FF)`:`background:#1E2540`;const s=pl?`background:linear-gradient(135deg,${c},#FF6B00);color:#000`:"";return`<div class="card"><div class="ctop" style="${t}"></div><div class="srow"><span class="tname r">${esc(h)}</span><div style="display:flex;gap:6px;align-items:center;flex-shrink:0"><div class="sbox" style="${s}">${pl?hs:"-"}</div><span class="vs">VS</span><div class="sbox" style="${s}">${pl?as_:"-"}</div></div><span class="tname">${esc(a)}</span></div>${!pl?'<div class="inprog">IN PROGRAMMA</div>':""}</div>`;}

function standings(g){const t={};(D.groups[g]||[]).forEach(n=>{t[n]={team:n,played:0,won:0,drawn:0,lost:0,gf:0,ga:0,gd:0,pts:0};});(D.matches[g]||[]).filter(m=>m.played).forEach(m=>{const h=t[m.home],a=t[m.away];if(!h||!a)return;h.played++;a.played++;h.gf+=(m.hs||0);h.ga+=(m.as||0);a.gf+=(m.as||0);a.ga+=(m.hs||0);if(m.hs>m.as){h.won++;h.pts+=3;a.lost++;}else if(m.hs<m.as){a.won++;a.pts+=3;h.lost++;}else{h.drawn++;a.drawn++;h.pts++;a.pts++;}h.gd=h.gf-h.ga;a.gd=a.gf-a.ga;});return Object.values(t).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);}
function scorers(){const t={};Object.values(D.matches).flat().filter(m=>m.played).forEach(m=>{Object.values(m.scorers||{}).forEach(pl=>{(pl||[]).forEach(p=>{if(p)t[p]=(t[p]||0)+1;});});});return Object.entries(t).map(([n,g])=>({name:n,goals:g})).sort((a,b)=>b.goals-a.goals);}

function renderAll(){renderHome();renderGironi();renderRisultati();renderMarcatori();renderDistinte();renderTabellone();}

function renderHome(){
  const pl=Object.values(D.matches).flat().filter(m=>m.played);
  const goals=pl.reduce((a,m)=>a+(m.hs||0)+(m.as||0),0);
  const sc=scorers();
  document.getElementById("homeStats").innerHTML=`<div class="scard" style="background:linear-gradient(135deg,rgba(0,229,255,0.1),#10131C);border:1px solid rgba(0,229,255,0.3)"><div class="snum" style="color:#00E5FF;text-shadow:0 0 20px #00E5FF">${pl.length}</div><div class="slbl">Partite giocate</div></div><div class="scard" style="background:linear-gradient(135deg,rgba(0,255,135,0.1),#10131C);border:1px solid rgba(0,255,135,0.3)"><div class="snum" style="color:#00FF87;text-shadow:0 0 20px #00FF87">${goals}</div><div class="slbl">Goal totali</div></div><div class="scard" style="background:linear-gradient(135deg,rgba(255,45,120,0.1),#10131C);border:1px solid rgba(255,45,120,0.3)"><div class="snum" style="color:#FF2D78;text-shadow:0 0 20px #FF2D78">${sc.length}</div><div class="slbl">Marcatori</div></div>`;
  const evs=D.events||[];
  let evH="";
  if(evs.length>0){
    const today=new Date().toISOString().split("T")[0];
    const sorted=[...evs].sort((a,b)=>a.date>b.date?1:-1);
    evH=stitle("📅 Programma","#00E5FF")+'<div class="evlist">';
    sorted.forEach(ev=>{
      const ip=ev.date&&ev.date<today,it=ev.date===today,c=ev.color||"#00E5FF";
      const d=ev.date?new Date(ev.date+"T00:00:00"):null;
      evH+=`<div class="evrow ${ip?"past":""}"><div class="evdate" style="${it?`border-color:${c};background:${c}20`:""}""><div class="evday" style="color:${it?"#000":c}">${d?d.getDate():"?"}</div><div class="evmon" style="color:${it?"#000":"#5A6480"}">${d?d.toLocaleDateString("it-IT",{month:"short"}):""}</div></div><div class="evcont" style="border-left:3px solid ${c}"><div style="display:flex;align-items:center"><span class="evname">${esc(ev.title||"Evento")}</span>${it?`<span class="oggi" style="background:${c}20;border:1px solid ${c}50;color:${c}">OGGI</span>`:""} ${ip?'<span style="font-size:10px;color:#5A6480;margin-left:8px;font-family:Oswald,sans-serif">CONCLUSO</span>':""}</div>${ev.description?`<div class="evdesc">${esc(ev.description)}</div>`:""}</div></div>`;
    });
    evH+="</div>";
  }
  document.getElementById("homeEvents").innerHTML=evH;
  const top=sc.slice(0,3);
  let sh="";
  if(top.length>0){
    sh=stitle("🥅 Top Marcatori","#FFD700");
    const md=["🥇","🥈","🥉"],cs=["#FFD700","#C0C0C0","#CD7F32"];
    top.forEach((s,i)=>{sh+=`<div style="display:flex;align-items:center;gap:12px;background:${i===0?"linear-gradient(135deg,rgba(255,215,0,0.1),#10131C)":"#10131C"};border:1px solid ${i===0?"rgba(255,215,0,0.4)":"#1E2540"};border-radius:12px;padding:12px 16px;margin:0 16px 8px"><span style="font-size:24px;min-width:32px">${md[i]}</span><span style="flex:1;font-family:'Oswald',sans-serif;font-size:16px;color:#E8EDF8">${esc(s.name)}</span><span style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:${cs[i]}">${s.goals}</span><span>⚽</span></div>`;});
  }
  document.getElementById("homeScorers").innerHTML=sh;
}

let aG="A",aR="A",aTeam=null;
function renderGironi(){
  document.getElementById("gironiTabs").innerHTML=["A","B","C","D"].map(g=>`<button class="gtab ${aG===g?"active":""}" style="${aG===g?`background:linear-gradient(135deg,${GC[g]},${GC[g]}88);color:#000;outline:none`:""}" onclick="setG('${g}')">Girone ${g}</button>`).join("");
  const st=standings(aG),c=GC[aG];
  let h=`<div class="standings" style="border:1px solid ${c}40"><div style="height:3px;background:linear-gradient(90deg,${c},#00E5FF)"></div><div class="sth"><span>#</span><span>Squadra</span><span>G</span><span>V</span><span>P</span><span>S</span><span>GF</span><span>GA</span><span>Pts</span></div>`;
  st.forEach((r,i)=>{const q=i<2;h+=`<div class="str" style="${q?`background:${c}0A`:""}"><span class="pos" style="color:${q?c:"#5A6480"}">${i+1}</span><span class="tm">${esc(r.team)}</span><span style="font-family:'Oswald',sans-serif;font-size:13px;color:#5A6480;text-align:center">${r.played}</span><span style="font-family:'Oswald',sans-serif;font-size:13px;color:#5A6480;text-align:center">${r.won}</span><span style="font-family:'Oswald',sans-serif;font-size:13px;color:#5A6480;text-align:center">${r.drawn}</span><span style="font-family:'Oswald',sans-serif;font-size:13px;color:#5A6480;text-align:center">${r.lost}</span><span style="font-family:'Oswald',sans-serif;font-size:13px;color:#5A6480;text-align:center">${r.gf}</span><span style="font-family:'Oswald',sans-serif;font-size:13px;color:#5A6480;text-align:center">${r.ga}</span><span class="pts" style="color:${q?c:"#E8EDF8"};text-shadow:${q?`0 0 10px ${c}`:"none"}">${r.pts}</span></div>`;});
  h+="</div><div style='text-align:center;margin:8px 16px 0;font-size:11px;color:#5A6480'>Le prime 2 si qualificano ai quarti di finale</div>";
  document.getElementById("gironiContent").innerHTML=h;
}
window.setG=g=>{aG=g;renderGironi();};

function renderRisultati(){
  document.getElementById("risultatiTabs").innerHTML=["A","B","C","D"].map(g=>`<button class="gtab ${aR===g?"active":""}" style="${aR===g?`background:linear-gradient(135deg,${GC[g]},${GC[g]}88);color:#000;outline:none`:""}" onclick="setR('${g}')">Girone ${g}</button>`).join("");
  const c=GC[aR];let h="";
  (D.matches[aR]||[]).forEach(m=>{
    h+=scard(m.home,m.away,m.hs,m.as,m.played,c);
    if(m.played){const al=Object.entries(m.scorers||{}).filter(([,p])=>p&&p.filter(x=>x).length>0);if(al.length>0){h+=`<div class="scbar">`;al.forEach(([t,p])=>{h+=`<span style="color:${c};font-family:'Oswald',sans-serif">${esc(t)}:</span> ${p.filter(x=>x).join(", ")} `;});h+=`</div>`;}}
  });
  document.getElementById("risultatiContent").innerHTML=h;
}
window.setR=g=>{aR=g;renderRisultati();};

function renderMarcatori(){
  const sc=scorers();const md=["🥇","🥈","🥉"],cs=["#FFD700","#C0C0C0","#CD7F32"],gd=["linear-gradient(135deg,#FFD700,#FF6B00)","linear-gradient(135deg,#C0C0C0,#888)","linear-gradient(135deg,#CD7F32,#8B4513)"];
  if(!sc.length){document.getElementById("scorersContent").innerHTML='<div style="text-align:center;color:#5A6480;font-family:Oswald,sans-serif;margin-top:40px;padding:20px">Nessun gol ancora segnato</div>';return;}
  let h="";sc.forEach((s,i)=>{const t=i<3;h+=`<div class="sccard" style="border-color:${t?cs[i]+"60":"#1E2540"}">${t?`<div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${gd[i]}"></div>`:""}<span style="font-family:'Bebas Neue',sans-serif;font-size:${t?28:18}px;min-width:38px;text-align:center">${t?md[i]:i+1}</span><span style="flex:1;font-family:'Oswald',sans-serif;font-size:16px;color:#E8EDF8">${esc(s.name)}</span><span style="font-family:'Bebas Neue',sans-serif;font-size:30px;color:${t?cs[i]:"#E8EDF8"}">${s.goals}</span><span>⚽</span></div>`;});
  document.getElementById("scorersContent").innerHTML=h;
}

function renderDistinte(){
  const el=document.getElementById("rostersContent");
  if(aTeam){
    const pl=(D.rosters[aTeam]||[]).filter(p=>p);
    let h=`<div style="padding:0 16px"><button onclick="setT(null)" style="background:#161B2C;border:1px solid #1E2540;color:#9B5DE5;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:13px;margin-bottom:16px">← TORNA ALLA LISTA</button><div style="background:linear-gradient(135deg,rgba(155,93,229,0.1),#10131C);border:1px solid rgba(155,93,229,0.3);border-radius:12px;padding:20px"><div style="font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;background:linear-gradient(90deg,#9B5DE5,#FF2D78);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px">${esc(aTeam)}</div>`;
    if(!pl.length)h+='<div style="text-align:center;color:#5A6480;font-family:Oswald,sans-serif">Rosa non ancora inserita</div>';
    pl.forEach((p,i)=>{h+=`<div style="display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #1E2540"><div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#9B5DE5,#FF2D78);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fff;flex-shrink:0">${i+1}</div><span style="font-family:'Oswald',sans-serif;font-size:15px;color:#E8EDF8">${esc(p)}</span></div>`;});
    h+="</div></div>";el.innerHTML=h;
  } else {
    let h="";
    Object.entries(D.groups).forEach(([g,teams])=>{
      const c=GC[g];h+=`<div style="margin-bottom:22px"><div style="font-family:'Bebas Neue',sans-serif;letter-spacing:4px;font-size:13px;color:${c};margin:0 16px 10px;text-shadow:0 0 10px ${c}">● GIRONE ${g}</div><div class="rgrid">`;
      teams.forEach(t=>{const cnt=(D.rosters[t]||[]).filter(p=>p).length;const btnIdx=Object.values(D.groups).flat().indexOf(t);h+=`<button class="rbtn" style="border-color:${c}40" onclick="setTbyName(this)" data-team="${esc(t)}"><div style="font-size:22px;margin-bottom:6px">👕</div><div style="font-family:'Oswald',sans-serif;font-size:13px;color:#E8EDF8;margin-bottom:4px">${esc(t)}</div><div style="font-size:11px;color:${c}">${cnt} giocatori →</div></button>`;});
      h+="</div></div>";
    });
    el.innerHTML=h;
  }
}
window.setT=t=>{aTeam=t;renderDistinte();};
window.setTbyName=btn=>{aTeam=btn.getAttribute('data-team');renderDistinte();};

function renderTabellone(){
  const ko=D.knockout;let h="";
  h+=stitle("⚔️ Quarti di finale","#00E5FF");ko.quarters.forEach(m=>{h+=scard(m.home,m.away,m.hs,m.as,m.played,"#00E5FF");});
  h+=stitle("🔥 Semifinali","#FF2D78");ko.semis.forEach(m=>{h+=scard(m.home,m.away,m.hs,m.as,m.played,"#FF2D78");});
  h+=stitle("🏆 Finale","#FFD700");h+=`<div style="position:relative;padding:3px;border-radius:14px;background:linear-gradient(135deg,#FFD700,#FF6B00,#FF2D78);box-shadow:0 8px 40px rgba(255,215,0,0.3)"><div style="background:#08090E;border-radius:12px">${scard(ko.final.home,ko.final.away,ko.final.hs,ko.final.as,ko.final.played,"#FFD700")}</div></div>`;
  document.getElementById("bracketContent").innerHTML=h;
}

// ADMIN
function renderAdmin(){rAT();rAR();rARs();rAK();rAE();}
function rAT(){let h="";Object.entries(D.groups).forEach(([g,t])=>{h+=`<div class="gblock"><div style="font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;color:${GC[g]};margin-bottom:10px">GIRONE ${g}</div>`;t.forEach((n,i)=>{h+=`<div style="margin-bottom:8px"><input value="${esc(n)}" onchange="uTN('${g}',${i},this.value)" placeholder="Squadra ${g}${i+1}"/></div>`;});h+="</div>";});document.getElementById("admin-teams").innerHTML=h;}
function rAR(){
  // Build a flat index: idx -> {g, teamIdx}
  window._rosterMap = {};
  let idx = 0;
  let h="";
  Object.entries(D.groups).forEach(([g,t])=>{
    t.forEach((team,ti)=>{
      const c=GC[g],pl=D.rosters[team]||[];
      const tIdx=idx++;
      window._rosterMap[tIdx]={g,ti,team};
      h+=`<div class="gblock"><div style="font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:${c};margin-bottom:10px">${esc(team)}</div>`;
      pl.forEach((p,pi)=>{
        h+=`<div class="irow"><input value="${esc(p)}" onchange="uPl(${tIdx},${pi},this.value)"/><button class="bdel" onclick="rPl(${tIdx},${pi})">✕</button></div>`;
      });
      h+=`<button class="bsm" style="width:100%;margin-top:4px" onclick="aPl(${tIdx})">+ Aggiungi giocatore</button></div>`;
    });
  });
  document.getElementById("admin-rosters").innerHTML=h;
}
function rARs(){let h="";Object.entries(D.matches).forEach(([g,ms])=>{const c=GC[g];h+=`<div style="margin-bottom:20px"><div style="color:${c};font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;margin-bottom:8px">GIRONE ${g}</div>`;ms.forEach((m,mi)=>{h+=`<div class="mblock"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="flex:1;text-align:right;font-family:'Oswald',sans-serif;font-size:13px;color:#E8EDF8">${esc(m.home)}</span><input type="number" min="0" value="${m.hs??""}" onchange="uSc('${g}',${mi},'hs',this.value)" style="width:55px;text-align:center;padding:6px 4px"/><span style="color:#5A6480">-</span><input type="number" min="0" value="${m.as??""}" onchange="uSc('${g}',${mi},'as',this.value)" style="width:55px;text-align:center;padding:6px 4px"/><span style="flex:1;font-family:'Oswald',sans-serif;font-size:13px;color:#E8EDF8">${esc(m.away)}</span></div>`;if(m.played){h+='<div>';[m.home,m.away].forEach(t=>{const sc=m.scorers[t]||[];h+=`<div style="margin-bottom:8px"><div style="font-size:11px;color:${c};font-family:'Oswald',sans-serif;margin-bottom:4px">${esc(t)}</div>`;sc.forEach((s,si)=>{h+=`<div class="scinp"><input value="${esc(s)}" onchange="uSco('${g}',${mi},'${esc(t)}',${si},this.value)"/><button class="bdel" onclick="rSco('${g}',${mi},'${esc(t)}',${si})">✕</button></div>`;});h+=`<button class="bsm" style="width:100%;margin-top:4px" onclick="aSco(this)" data-g="${g}" data-mi="${mi}" data-team="${esc(t)}">+ Gol ${esc(t)}</button></div>`;});h+='</div>';}h+="</div>";});h+="</div>";});document.getElementById("admin-results").innerHTML=h;}
function rAK(){let h="";[{l:"Quarti di Finale",k:"quarters"},{l:"Semifinali",k:"semis"}].forEach(({l,k})=>{h+=`<div style="margin-bottom:20px"><div style="color:#FFD700;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;margin-bottom:8px">${l}</div>`;D.knockout[k].forEach((m,i)=>{h+=`<div class="mblock"><div class="irow"><input value="${esc(m.home)}" onchange="uKT('${k}',${i},'home',this.value)"/><input value="${esc(m.away)}" onchange="uKT('${k}',${i},'away',this.value)"/></div><div style="display:flex;align-items:center;gap:8px"><input type="number" min="0" value="${m.hs??""}" onchange="uKS('${k}',${i},'hs',this.value)" style="width:60px;text-align:center"/><span style="color:#5A6480">-</span><input type="number" min="0" value="${m.as??""}" onchange="uKS('${k}',${i},'as',this.value)" style="width:60px;text-align:center"/></div></div>`;});h+="</div>";});h+=`<div style="color:#FFD700;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;margin-bottom:8px">FINALE</div><div class="mblock" style="border-color:rgba(255,215,0,0.4)"><div class="irow"><input value="${esc(D.knockout.final.home)}" onchange="uKT('final',0,'home',this.value)"/><input value="${esc(D.knockout.final.away)}" onchange="uKT('final',0,'away',this.value)"/></div><div style="display:flex;align-items:center;gap:8px"><input type="number" min="0" value="${D.knockout.final.hs??""}" onchange="uKS('final',0,'hs',this.value)" style="width:60px;text-align:center"/><span style="color:#5A6480">-</span><input type="number" min="0" value="${D.knockout.final.as??""}" onchange="uKS('final',0,'as',this.value)" style="width:60px;text-align:center"/></div></div>`;document.getElementById("admin-knockout").innerHTML=h;}
function rAE(){const ev=D.events||[];let h=`<div style="font-size:12px;color:#5A6480;margin-bottom:16px;font-family:'Oswald',sans-serif">Aggiungi eventi che appariranno nella Home</div>`;ev.forEach((e,i)=>{h+=`<div class="eadm"><div class="irow"><input type="date" value="${e.date||""}" onchange="uEv(${i},'date',this.value)"/><select style="width:50px;padding:8px 4px" onchange="uEv(${i},'color',this.value)"><option value="#00E5FF" ${e.color==="#00E5FF"?"selected":""}>🔵</option><option value="#FFD700" ${e.color==="#FFD700"?"selected":""}>🟡</option><option value="#00FF87" ${e.color==="#00FF87"?"selected":""}>🟢</option><option value="#FF2D78" ${e.color==="#FF2D78"?"selected":""}>🔴</option><option value="#9B5DE5" ${e.color==="#9B5DE5"?"selected":""}>🟣</option><option value="#FF6B00" ${e.color==="#FF6B00"?"selected":""}>🟠</option></select><button class="bdel" onclick="rEv(${i})">✕</button></div><input value="${esc(e.title||"")}" onchange="uEv(${i},'title',this.value)" placeholder="Titolo evento" style="margin-bottom:8px"/><input value="${esc(e.description||"")}" onchange="uEv(${i},'description',this.value)" placeholder="Descrizione"/></div>`;});h+=`<button class="bsm" style="width:100%;margin-top:4px;padding:12px" onclick="aEv()">+ Aggiungi Evento</button>`;document.getElementById("admin-events").innerHTML=h;}

window.uTN=(g,i,v)=>{const o=D.groups[g][i];D.groups[g][i]=v;D.matches[g]=D.matches[g].map(m=>({...m,home:m.home===o?v:m.home,away:m.away===o?v:m.away,scorers:Object.fromEntries(Object.entries(m.scorers).map(([k,s])=>[k===o?v:k,s]))}));if(D.rosters[o]){D.rosters[v]=D.rosters[o];delete D.rosters[o];}};
window.uPl=(idx,i,v)=>{const {team}=window._rosterMap[idx];if(!D.rosters[team])D.rosters[team]=[];D.rosters[team][i]=v;};
window.aPl=idx=>{const {team}=window._rosterMap[idx];if(!D.rosters[team])D.rosters[team]=[];D.rosters[team].push("");rAR();};
window.rPl=(idx,i)=>{const {team}=window._rosterMap[idx];D.rosters[team].splice(i,1);rAR();};
window.uSc=(g,mi,f,v)=>{D.matches[g][mi][f]=v===""?null:parseInt(v);D.matches[g][mi].played=D.matches[g][mi].hs!==null&&D.matches[g][mi].as!==null;if(D.matches[g][mi].played)rARs();};
window.aSco=btn=>{const g=btn.getAttribute('data-g'),mi=parseInt(btn.getAttribute('data-mi')),t=btn.getAttribute('data-team');if(!D.matches[g][mi].scorers[t])D.matches[g][mi].scorers[t]=[];D.matches[g][mi].scorers[t].push("");rARs();};
window.uSco=(g,mi,t,si,v)=>{if(D.matches[g][mi].scorers[t])D.matches[g][mi].scorers[t][si]=v;};
window.rSco=(g,mi,t,si)=>{D.matches[g][mi].scorers[t].splice(si,1);rARs();};
window.uKT=(r,i,f,v)=>{if(r==="final")D.knockout.final[f]=v;else D.knockout[r][i][f]=v;};
window.uKS=(r,i,f,v)=>{if(r==="final"){D.knockout.final[f]=v===""?null:parseInt(v);D.knockout.final.played=D.knockout.final.hs!==null&&D.knockout.final.as!==null;}else{D.knockout[r][i][f]=v===""?null:parseInt(v);D.knockout[r][i].played=D.knockout[r][i].hs!==null&&D.knockout[r][i].as!==null;}};
window.aEv=()=>{if(!D.events)D.events=[];D.events.push({id:Date.now()+"",date:"",title:"",description:"",color:"#00E5FF"});rAE();};
window.uEv=(i,f,v)=>{D.events[i][f]=v;};
window.rEv=i=>{D.events.splice(i,1);rAE();};
window.saveAll=async()=>{const b=document.querySelector(".asave .bprim");b.textContent="Salvataggio...";b.disabled=true;await window._save();renderAll();b.textContent="💾 SALVA TUTTO";b.disabled=false;alert("Salvato!");};

window.switchPage=(id,btn)=>{document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById("page-"+id).classList.add("active");document.querySelectorAll(".nbtn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");};
window.switchAdminTab=(id,btn)=>{document.querySelectorAll(".asec").forEach(s=>s.classList.remove("active"));document.getElementById("admin-"+id).classList.add("active");document.querySelectorAll(".atab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");};

let tc=0,tt=null;
window.handleLogoTap=()=>{tc++;if(tt)clearTimeout(tt);if(tc>=5){tc=0;openPw();return;}tt=setTimeout(()=>{tc=0;},2000);};
window.openPw=()=>{document.getElementById("pwModal").classList.add("open");document.getElementById("pwInput").value="";};
window.closePw=()=>{document.getElementById("pwModal").classList.remove("open");};
window.checkPw=()=>{if(document.getElementById("pwInput").value===PW){closePw();document.getElementById("adminOverlay").classList.add("open");renderAdmin();}else alert("Password errata");};
window.closeAdmin=()=>{document.getElementById("adminOverlay").classList.remove("open");};
</script>
</body>
